/*************************************************************************
 * Coffee2_sim.ini  --  STM32F407 软件仿真初始化脚本
 *
 * 作用:  在 Keil - Use Simulator 模式下做 CPU / FreeRTOS / 业务逻辑
 *        仿真, 重点观察 USART1 结构化日志 与 各 Task 状态.
 *
 * 注意:
 *  - 以太网 / DP83848 无法在 Keil 仿真里真正跑 TCP, 因此 C2Server/
 *    C2Robot 会停留在"等网络就绪"等待; 本脚本的意义是验证启动链、
 *    FreeRTOS 调度、Workflow 状态机、日志环形队列等 CPU/逻辑部分.
 *  - 仿真不含真实外设时序, 涉及 UART DMA 收发的外设行为以逻辑为准.
 *************************************************************************/

/* ---------- 1. 基本环境: 复位 CPU, 打开 Trace(逻辑分析仪) ---------- */
RESET
TRACE ON

/* ---------- 2. 配置系统时钟为 168MHz (与 real HW HSE 8M PLL 对齐) ---
 * 仿真时钟本身不精确, 这里让 uVision 知道运行频率保证 Tick 计算.
 * 实际固件 SystemClock_Config 会自己配置, 此值主要影响时间显示. */
CLOCK 168000000

/* ---------- 3. 仿真模型只带部分外设, 预置关键场景 ---------- */

/* 定义: 让 CPU 复位后停在 main() 入口前, 便于单步 --------------------*/
FUNC void BreakPoint_SetUp(void) {
    ; 这里可以在需要的主入口设断点
}
BreakPoint_SetUp()

/* ---------- 4. 硬件寄存器预置(虚拟仿真) ---------- */
; 仅示范; 真实场景通常由固件自己产生, 无需手写
; _MAP 0x40021000, 0x40021400  /* RCC 例: 一般由 SystemInit 完成, 可省略 */

/* ---------- 5. 可选: 预置一个用于仿真的输入信号(逻辑分析仪) ----------
 * 如需在仿真里给 GPIO 注入电平变化, 用:
 *   SIGNAL ...   (较复杂, 按需再展开)
 * 目前 Coffee2 靠在 GRAPHIC 窗口看 RUN 灯翻转 / 日志即可, 默认不注入.
 */

/* ---------- 6. 打开串口窗口对应寄存器, 便于收 USART1 日志 ----------
 * Keil 的 Serial Window UART#1 默认绑定到仿真的第一个串口"寄存器组".
 * 仿真模式里 printf/Transmit 会经虚拟外设触发窗口输出.
 * 注意: Coffee2 日志走 USART1 + DMA, 仿真下 DMA 完成由逻辑模拟,
 *       最终字符会出现在 UART#1 窗口(若看不到 DMA, 属仿真局限). */

/* ---------- 7. 加载程序(Coffee2 链接基址 0x0800C000) ---------- */
; 若在 Options->Debug 已设好 Reset and Run, 通常无需手动 LOAD;
; 需要时取消下面注释并改成实际 axf 名:
; LOAD "%L" INCREMENTAL
; LOAD ".\Objects\Coffee2\Coffee2.axf" INCREMENTAL

/* ---------- 8. 复位并运行到 main() ---------- */
GO
